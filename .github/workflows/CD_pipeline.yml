name: 'CD Pipeline'

on:
  pull_request: 
    types:
      - closed
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    
      
      
jobs:
  
  build:
    name: 'Create Release'
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    
    steps:
      - name: 'Git Checkout'
        uses: actions/checkout@v4
      - name: 'Setup Python'
        uses: actions/setup-python@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      
      - name: 'Build distribution'
        id: build_distribution
        working-directory: ${{ github.workspace }}/src
        run: |
          uv build
          echo "PACKAGE_VERSION=$(python3 get_project_metadata.py version)" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$(python3 get_project_metadata.py name)" >> $GITHUB_ENV
      
      - name: 'Create Release'
        if: github.event.pull_request.merged == true
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ env.PACKAGE_NAME }}_v${{ env.PACKAGE_VERSION }}'
          tag_name: '${{ env.PACKAGE_NAME }}_v${{ env.PACKAGE_VERSION }}'
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/src/dist/**

      - name: 'Publish release'
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
      