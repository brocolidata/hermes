name: Build and Publish Lambda Layer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install zip

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          working-directory: src

      - name: Install project dependencies
        run: >
          uv sync 
          --all-extras 
          --all-groups

      - name: Export Requirements
        run: >
          uv export 
          --extra custom_source
          --extra s3_destination
          --extra s3_destination_core
          --extra athena_iceberg_destination
          --no-dev 
          --no-editable
          --format requirements-txt 
          -o lambda_layer_requirements.txt

      - name: Create Lambda Layer directory
        run: mkdir -p lambda_layer/python

      - name: Install Dependencies for Layer
        run: >
          uv pip install 
          --target=lambda_layer/python 
          -r lambda_layer_requirements.txt

      - name: Upload Lambda Layer as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python
          path: lambda_layer/
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true