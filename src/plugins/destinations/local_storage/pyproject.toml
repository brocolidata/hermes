[project]
name = "local_storage_destination"
version = "0.1.0"
description = "Hermes local storage destination connector"
readme = "README.md"
authors = [
    { name = "Brocoli Data", email = "contact.brocoli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hermes",
    "generic_object_storage_destination",
]

[tool.uv.sources]
# hermes = { path = "../../.." }
generic_object_storage_destination = { path = "../generic_object_storage"}


[project.entry-points."hermes_plugins.destinations"]
local_storage = "local_storage_destination.connector:LocalStorageDestination"