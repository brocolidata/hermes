[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes_cli"
version = "0.1.0"
description = "Hermes Command Line Interface"
authors = [{ name = "Brocoli Data", email = "contact.brocoli@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "hermes",
    "typer",
    "questionary==1.10.0",
    "jsonschema>=4.23.0",
    "click<8.2.0",
    "omegaconf>=2.3.0",
]

[project.scripts]
hermes = "cli.cli:app"

[tool.uv]
package = true

[tool.uv.sources]
hermes = { path = "../../..", editable = true }

# Include json_schemas in the package
[tool.hatch.build.targets.wheel]
packages = ["cli"]
include = ["cli/json_schemas/**/*"]

[tool.hatch.build.targets.sdist]
include = ["cli/", "cli/json_schemas/**/*"]
