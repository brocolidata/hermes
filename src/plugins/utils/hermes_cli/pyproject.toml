[project]
name = "hermes_cli"
version = "0.1.0"
description = "Hermes Command Line Interface"
authors = [{ name = "Brocoli Data", email = "contact.brocoli@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "hermes",
    "typer",
    "questionary",
    "jsonschema>=4.23.0",
    "click<8.2.0",
    "omegaconf>=2.3.0",
]

[tool.uv]
package = true

[project.scripts]
hermes = "cli.cli:app"

[tool.uv.sources]
hermes = { path = "../../..", editable = true }

[tool.uv.include]
"cli/json_schemas/*" = {}
