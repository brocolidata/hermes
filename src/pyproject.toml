[project]
name = "hermes"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brocoli Data", email = "contact.brocoli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2025.2.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
aws = [
    "awswrangler>=3.10.1",
    "s3fs>=2025.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "moto>=5.1.1",
    "pytest>=8.3.4",
]
