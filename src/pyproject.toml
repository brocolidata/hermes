[tool.poetry]
name = "hermes"
version = "0.1.0"
description = "A simple Serverless-compatible data Extract-Load framework"
authors = ["brocolidata <contact.brocolidata@gmail.com>"]
readme = "README.md"
packages = [{include = "hermes"}]

[tool.poetry.dependencies]
python = "^3.10"
omegaconf = "^2.3.0"
pandas = "^2.0.3"
pyarrow = "^12.0.1"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.0.284"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
