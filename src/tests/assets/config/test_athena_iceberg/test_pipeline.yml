sources:
  - name: float_rates
    description: |
      An API with float rates data
    type: custom
    config: 
      extractor: FloatRatesSourceExtractor
      module_path: "change_rates.py"
      kwargs: 
        endpoint: 'https://www.floatrates.com/daily/mad.json'
      # outputs:
      #   float_rates: dirham_change_rates
      tables:
        - name: dirham_change_rates
          data_key: float_rates
          kwargs: 
            endpoint: 'https://www.floatrates.com/daily/mad.json'
            last_date: $destinations.demo_athena_iceberg.variables.last_date

destinations:
  - name: demo_athena_iceberg
    description: |
      A Google Cloud Storage destination for testing purposes
    type: athena_iceberg
    config:
      glue_database: raw_glue_database
      table_location: s3://a-bucket/table-location
      temp_path: s3://a-bucket/hermes-temp-path
    variables:
      last_date: 
        query: select max(date) from {this}
      
pipelines:
  - name: sync_float_rates
    sources: 
      # - dirham_change_rates
      - name: float_rates
        tables: 
          - dirham_change_rates
    destinations: 
      - demo_athena_iceberg
    schedule: '0 20 * * 1-5'